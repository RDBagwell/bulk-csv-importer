version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      # The Inertia packages share @inertiajs/core, and the shared page-prop
      # types only apply when every package uses the same copy of it. Bump
      # them together so they never end up on different versions.
      inertia:
        patterns:
          - "@inertiajs/*"
    ignore:
      # Keep the Node type definitions on the Node major CI runs (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
